<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social-RAG 论文阅读</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        
        .header-title {
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        
        .header-title h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }
        
        .header-title .badge {
            background: rgba(255, 255, 255, 0.2);
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
        }
        
        .header-actions {
            display: flex;
            gap: 1rem;
        }
        
        .header-actions a {
            color: white;
            text-decoration: none;
            padding: 0.5rem 1rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        
        .header-actions a:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .pdf-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: stretch;
            padding: 1rem;
        }
        
        .pdf-wrapper {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
        }
        
        .pdf-wrapper iframe {
            width: 100%;
            height: calc(100vh - 120px);
            border: none;
        }
        
        .fallback {
            padding: 3rem;
            text-align: center;
            color: #666;
        }
        
        .fallback h2 {
            margin-bottom: 1rem;
            color: #333;
        }
        
        .fallback a {
            display: inline-block;
            margin-top: 1rem;
            padding: 0.8rem 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: transform 0.3s ease;
        }
        
        .fallback a:hover {
            transform: translateY(-2px);
        }
        
        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
                padding: 1rem;
            }
            
            .header-title h1 {
                font-size: 1.2rem;
            }
            
            .pdf-wrapper iframe {
                height: calc(100vh - 180px);
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-title">
            <h1>📄 Social-RAG: Retrieving from Group Interactions to Socially Ground AI Generation</h1>
            <span class="badge">CHI 2025</span>
        </div>
        <div class="header-actions">
            <a href="/" title="返回PPT演示">🎯 返回PPT</a>
            <a href="/static/pdf/social_rag.pdf" download title="下载PDF">⬇️ 下载PDF</a>
        </div>
    </header>
    
    <div class="pdf-container">
        <div class="pdf-wrapper">
            <iframe src="/static/pdf/social_rag.pdf" type="application/pdf">
                <div class="fallback">
                    <h2>📄 无法在浏览器中预览PDF</h2>
                    <p>您的浏览器可能不支持直接预览PDF文件</p>
                    <a href="/static/pdf/social_rag.pdf" download>点击下载PDF文件</a>
                </div>
            </iframe>
        </div>
    </div>
</body>
</html>
